<!DOCTYPE html>

<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>秋隐 · Q版萌物小幽灵</title>
<style>
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    background: transparent !important;
    overflow: hidden;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    touch-action: none;
    user-select: none;
  }
  #stage {
    position: fixed; inset: 0; z-index: 5;
    display: flex; align-items: center; justify-content: center;
    pointer-events: none;
  }
  #pet {
    position: relative;
    width: 160px; height: 190px;
    transform: translate(var(--dx,0), var(--dy,0));
    touch-action: none;
    transition: transform .7s cubic-bezier(.34,1.56,.64,1);
    pointer-events: auto;
    cursor: grab;
  }
  #pet:active { cursor: grabbing; }
  svg { width: 100%; height: 100%; display: block; }
  #bubble {
    position: absolute; top: -42px; left: 50%;
    transform: translateX(-50%);
    background:#fff; color:#8a5fd0;
    padding: 8px 15px; border-radius: 16px;
    font-size: 13px; white-space: nowrap;
    box-shadow: 0 4px 12px rgba(0,0,0,.15);
    opacity: 0; pointer-events: none;
    transition: opacity .25s;
  }
  #bubble:before {
    content:""; position:absolute; bottom:-6px; left:50%; transform:translateX(-50%);
    border:6px solid transparent; border-top-color:#fff; border-bottom-width:0;
  }
  #body { animation: float 3.8s ease-in-out infinite; transform-origin: center bottom; }
  @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-4px)} }
  #handL { transform-origin: 38px 150px; animation: waveL 5s ease-in-out infinite; }
  #handR { transform-origin: 182px 150px; animation: waveR 5s ease-in-out infinite; }
  @keyframes waveL { 0%,100%{transform:rotate(0)} 25%{transform:rotate(-10deg)} 50%{transform:rotate(0)} }
  @keyframes waveR { 0%,100%{transform:rotate(0)} 75%{transform:rotate(10deg)} }
</style>
</head>
<body>

<div id="stage">
  <div id="pet">
    <div id="bubble"></div>
    <svg viewBox="0 0 220 260" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="ghostG" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#ffffff"/>
          <stop offset="55%" stop-color="#fdf6ff"/>
          <stop offset="100%" stop-color="#f3e8ff"/>
        </linearGradient>
      </defs>
      <g id="body">
        <path d="M110 52
                 C72 52 44 80 42 118
                 C41 148 45 176 52 198
                 C64 186 74 196 84 200
                 C94 204 103 196 110 200
                 C117 196 126 204 136 200
                 C146 196 156 186 168 198
                 C175 176 179 148 178 118
                 C176 80 148 52 110 52 Z"
             fill="url(#ghostG)" stroke="#e6d5ff" stroke-width="3" stroke-linejoin="round"/>
      </g>
      <g id="hands">
        <circle id="handL" cx="38" cy="150" r="15" fill="#fff" stroke="#e6d5ff" stroke-width="3"/>
        <circle id="handR" cx="182" cy="150" r="15" fill="#fff" stroke="#e6d5ff" stroke-width="3"/>
      </g>
      <g id="face">
        <ellipse cx="86" cy="120" rx="14" ry="16" fill="#3a2f5c"/>
        <ellipse cx="134" cy="120" rx="14" ry="16" fill="#3a2f5c"/>
        <circle cx="82" cy="114" r="5.5" fill="#fff"/>
        <circle cx="130" cy="114" r="4.5" fill="#fff" opacity=".9"/>
        <circle cx="91" cy="128" r="2.5" fill="#fff" opacity=".55"/>
        <ellipse cx="58" cy="146" rx="14" ry="10" fill="#ffb3cf" opacity=".75"/>
        <ellipse cx="162" cy="146" rx="14" ry="10" fill="#ffb3cf" opacity=".75"/>
        <path d="M104 150 Q110 144 116 150" stroke="#a087e0" stroke-width="3.5" fill="none" stroke-linecap="round"/>
      </g>
    </svg>
  </div>
</div>

<script>
  const pet = document.getElementById('pet');
  const bubble = document.getElementById('bubble');
  let timer = null;

  window.onPetSay = function(text, onDone, random) {
    let t = text;
    if (random) t = text[Math.floor(Math.random()*text.length)];
    bubble.textContent = t || '嗯？戳我干嘛～';
    bubble.style.opacity = '1';
    clearTimeout(timer);
    timer = setTimeout(function(){ bubble.style.opacity='0'; if(onDone)onDone(); }, 2200);
  };

  window.onPetAct = function(action) {
    if (action === 'tap') {
      pet.style.transition = 'transform .3s';
      pet.style.setProperty('--dy','-14px');
      setTimeout(function(){ pet.style.setProperty('--dy','0px'); }, 300);
    }
  };
</script>
</body>
</html>
