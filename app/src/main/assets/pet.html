<!DOCTYPE html>

<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>秋隐</title>
<style>
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    background: transparent !important;
    overflow: hidden;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    user-select: none;
    -webkit-user-select: none;
  }
  #pet {
    position: relative;
    width: 140px; height: 170px;
    margin: auto;
  }
  #pet svg { width: 100%; height: 100%; display: block; }
  #bubble {
    position: absolute;
    top: -42px; left: 50%;
    transform: translateX(-50%) scale(.6);
    background: rgba(255,255,255,.95);
    color: #6b5a8e;
    padding: 6px 12px;
    border-radius: 16px;
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
    opacity: 0;
    transition: all .25s ease;
    box-shadow: 0 4px 14px rgba(80,60,120,.35);
    pointer-events: none;
  }
  #bubble.show { opacity: 1; transform: translateX(-50%) scale(1); }
</style>
</head>
<body>
  <div id="pet">
    <div id="bubble">嗨，我是秋隐✨</div>
    <svg viewBox="0 0 150 200" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="bodyG" cx="50%" cy="35%" r="80%">
          <stop offset="0%" stop-color="#fff6e8"/>
          <stop offset="60%" stop-color="#fce4f5"/>
          <stop offset="100%" stop-color="#e8d4ff"/>
        </radialGradient>
        <linearGradient id="cheekG" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#ffb3c1"/>
          <stop offset="100%" stop-color="#ff8fab"/>
        </linearGradient>
      </defs>
      <circle cx="26" cy="120" r="13" fill="url(#bodyG)" stroke="#dcc8f0" stroke-width="2"/>
      <circle cx="124" cy="120" r="13" fill="url(#bodyG)" stroke="#dcc8f0" stroke-width="2"/>
      <ellipse cx="58" cy="188" rx="16" ry="8" fill="url(#bodyG)" stroke="#dcc8f0" stroke-width="2"/>
      <ellipse cx="92" cy="188" rx="16" ry="8" fill="url(#bodyG)" stroke="#dcc8f0" stroke-width="2"/>
      <path id="body" d="M75 38 C 112 38, 134 70, 134 108 C 134 152, 108 180, 75 180 C 42 180, 16 152, 16 108 C 16 70, 38 38, 75 38 Z"
            fill="url(#bodyG)" stroke="#dcc8f0" stroke-width="3"/>
      <circle cx="42" cy="118" r="12" fill="url(#cheekG)" opacity=".75"/>
      <circle cx="108" cy="118" r="12" fill="url(#cheekG)" opacity=".75"/>
    </svg>
  </div>
<script>
  const pet = document.getElementById('pet');
  const bubble = document.getElementById('bubble');
  function say(txt) {
    bubble.textContent = txt;
    bubble.classList.add('show');
    clearTimeout(say._t);
    say._t = setTimeout(() => bubble.classList.remove('show'), 2000);
  }
  window.onPetSay = function (txt) { say(txt); };
  setTimeout(function () { say('我是秋隐哦～'); }, 800);
</script>
</body>
</html>
