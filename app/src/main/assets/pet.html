<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        * { margin: 0; padding: 0; }
        body { background: transparent; overflow: hidden; width: 100%; height: 100%; }
        #pet { position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); }
        #bubble {
            position: absolute; top: -10px; left: 50%; transform: translateX(-50%);
            background: rgba(255,255,255,0.9); color: #333;
            padding: 6px 10px; border-radius: 12px; font-size: 12px;
            white-space: nowrap; max-width: 150px; opacity: 0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2); text-align: center;
            transition: opacity 0.3s;
        }
    </style>
</head>
<body>
    <div id="bubble"></div>
    <svg id="pet" width="120" height="150" viewBox="0 0 120 150">
        <circle cx="60" cy="50" r="40" fill="#7b5ea7"/>
        <circle cx="45" cy="42" r="6" fill="#fff"/>
        <circle cx="75" cy="42" r="6" fill="#fff"/>
        <circle cx="47" cy="44" r="3" fill="#5b3f8a"/>
        <circle cx="77" cy="44" r="3" fill="#5b3f8a"/>
        <path d="M50 62 Q60 72 70 62" stroke="#5b3f8a" stroke-width="2" fill="none"/>
        <circle cx="20" cy="40" r="8" fill="#e8a0a0"/>
        <circle cx="100" cy="40" r="8" fill="#e8a0a0"/>
        <rect x="30" y="95" width="60" height="45" rx="18" fill="#8e6bb8"/>
        <rect x="42" y="150" width="12" height="30" rx="6" fill="#7b5ea7"/>
        <rect x="66" y="150" width="12" height="30" rx="6" fill="#7b5ea7"/>
    </svg>
    <script>
        var bubbleTimeout = null;
        window.onPetSay = function(text) {
            var b = document.getElementById('bubble');
            b.textContent = text;
            b.style.opacity = '1';
            clearTimeout(bubbleTimeout);
            bubbleTimeout = setTimeout(function() {
                b.style.opacity = '0';
            }, 3000);
        };
    </script>
</body>
</html>
